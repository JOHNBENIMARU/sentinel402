[package]
name = "audit-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = { version = "2.8", default-features = false }

[dev-dependencies]
odra-test = { version = "2.8", default-features = false }

[build-dependencies]
odra-build = { version = "2.8", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8", default-features = false }

[[bin]]
name = "audit_registry_build_contract"
path = "bin/build_contract.rs"
test = false

[profile.release]
codegen-units = 1
lto = true
