[package]
name = "sentinel402-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
casper-types = { version = "6.1.0", features = ["std", "once_cell"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
